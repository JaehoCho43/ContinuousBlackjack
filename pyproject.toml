[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-blackjack"
version = "0.1.0"
description = "Continuous blackjack: Nash equilibrium, Monte Carlo verification and a small simulation arena."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "cython>=3.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
